# The teachers' copy of a page with solutions (each chapter, and the one
# example that has them) is listed under that page with `audience: instructor`:
# teachers see it, students never do, and as the page's last entry it changes
# no student page's number.
format: jb-book
root: preface
# The parts carry no captions: Alps imports a captioned part as a unit of
# its own, with its chapters one level down, so without them every page is a
# top-level unit. The root is unit 0, so the Preface is 0 and Chapter N is
# unit N.
parts:
- numbered: True
